<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="azulGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#198cff"/>
      <stop offset="1" stop-color="#0a6fe0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Anel externo -->
  <circle cx="200" cy="200" r="180" fill="#050a12" stroke="url(#azulGrad)" stroke-width="8" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="165" fill="none" stroke="#198cff" stroke-width="1" opacity="0.4"/>

  <!-- 3 dispositivos: celular (esq), notebook (centro), impressora (dir) -->
  <g fill="none" stroke="#55b4ff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Celular -->
    <rect x="115" y="90" width="48" height="80" rx="8"/>
    <line x1="130" y1="160" x2="148" y2="160"/>
    <circle cx="139" cy="102" r="2" fill="#55b4ff"/>

    <!-- Notebook -->
    <rect x="172" y="100" width="70" height="48" rx="4"/>
    <line x1="160" y1="152" x2="254" y2="152"/>

    <!-- Impressora -->
    <rect x="248" y="110" width="52" height="34" rx="4"/>
    <rect x="258" y="90" width="32" height="22" rx="2"/>
    <line x1="256" y1="152" x2="292" y2="152"/>
    <circle cx="288" cy="124" r="2" fill="#55b4ff"/>
  </g>

  <!-- Chave inglesa central (símbolo técnico) -->
  <g transform="translate(200 175) rotate(45)" fill="url(#azulGrad)" stroke="#fff" stroke-width="2">
    <path d="M -8 -14 L 8 -14 L 8 -6 C 14 -4 14 4 8 6 L 8 14 L -8 14 L -8 6 C -14 4 -14 -4 -8 -6 Z"/>
    <circle cx="0" cy="0" r="4" fill="#050a12" stroke="#fff" stroke-width="1.5"/>
  </g>

  <!-- Texto: REPARO -->
  <text x="200" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="44" font-weight="900" fill="#ffffff" letter-spacing="2">REPARO</text>

  <!-- Texto: TECH -->
  <text x="200" y="290" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="56" font-weight="900" fill="url(#azulGrad)" letter-spacing="6">TECH</text>

  <!-- Linha divisória -->
  <line x1="80" y1="305" x2="320" y2="305" stroke="#198cff" stroke-width="1" opacity="0.5"/>

  <!-- Slogan -->
  <text x="200" y="330" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="14" font-weight="700" fill="#8ba0bf" letter-spacing="3">
    CELULARES • COMPUTADORES
  </text>
  <text x="200" y="352" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="14" font-weight="700" fill="#8ba0bf" letter-spacing="3">
    IMPRESSORAS
  </text>

  <!-- Localização -->
  <text x="200" y="378" text-anchor="middle" font-family="Inter, Arial, sans-serif"
        font-size="12" font-weight="600" fill="#55b4ff">
    📍 CUSTÓDIA - PE e região
  </text>
</svg>